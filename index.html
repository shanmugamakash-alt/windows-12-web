<!DOCTYPE html>
<html>
    <title>Windows 12</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            background-image: url(./Wallpaper-Default-1-2048x1152.png);
            height: 100vh;
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .card{
            background-color: #ffffff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .card h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #333333;
        }

        .card p {
            font-size: 16px;
            color: #666666;
        }

        
    </style>


    <body>
        <div class="card">
            <h1>Welcome to windows 12</h1>
            <p>Hello World</p>
        </div>

        <div style="background-color: rgba(0, 0, 0, 0.25); color: #fff; display: flex; justify-content: space-around;bottom: 90%">
            <p style="margin-left: 16px;">
                Windows 12
            </p>

            <p style="margin-right: 16px;">
                9/19/2023 9:58 AM
            </p>
        </div>
    </body>

</html>
